<title>ConciseClaude 5.0 vs 4.0</title>
<style>

@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {

  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark; --surface-0: #111110; --surface-1: #1a1a19; --border: #2c2c2a; --grid: #262624;

* { box-sizing: border-box; }
html, body { margin: 0; }
.viz-root { min-height: 100vh; background: var(--surface-0); color: var(--text-primary);

.sub { color: var(--text-secondary); margin: 0; }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; color: var(--text-secondary); font-size: 13px; }
.key { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; padding: 2px; background: var(--surface-1); }
.seg button { font: inherit; font-size: 12.5px; color: var(--text-secondary); background: none; border: 0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-0); color: var(--text-primary); font-weight: 600; }
.theme { font: inherit; font-size: 12px; color: var(--text-secondary); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; cursor: pointer; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
.kpi .label { color: var(--text-secondary); font-size: 13px; }
.kpi .value { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .detail { color: var(--text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .bad { color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.note { color: var(--text-muted); font-size: 12.5px; margin: 0 0 14px; }
.row-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--text-secondary); font-size: 12px; font-family: inherit; }
svg .muted { fill: var(--text-muted); font-size: 11px; }
svg .strong { fill: var(--text-primary); font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--border); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-secondary); font-weight: 500; }
td.win { color: var(--good); font-weight: 600; }
td.loss { color: var(--bad); font-weight: 600; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 4px 16px rgba(0,0,0,.14); opacity: 0; z-index: 9; font-variant-numeric: tabular-nums; }
.tip .r { display: flex; gap: 14px; justify-content: space-between; color: var(--text-secondary); }
.tip b { font-weight: 600; }
footer { color: var(--text-muted); font-size: 12.5px; margin-top: 18px; line-height: 1.6; }
@media (max-width: 800px) { .kpis { grid-template-columns: repeat(2, 1fr); } .grid2 { grid-template-columns: 1fr; } }
</style>
</head>

  <section class="grid2">
    <div class="card">

  const cls = (v4, v5, better) => (better(v5, v4) ? "win" : better(v4, v5) ? "loss" : "");
  let h = `<tr><th>Fix</th><th>Default</th><th>4.0</th><th>5.0</th></tr>`;
  h += `<tr><td>Depth answer (tokens)</td><td>${A.off.depth_out.toLocaleString()}</td><td>${A.v4.depth_out.toLocaleString()}</td><td class="${cls(A.v4.depth_out, A.v5.depth_out, (a, b) => a > b * 1.5)}">${A.v5.depth_out.toLocaleString()}</td></tr>`;
  for (const c of D.checks) {
    const v = c.vals[model];
    h += `<tr><td>${c.label}</td><td>${v.off}/2</td><td>${v.v4}/2</td><td class="${cls(v.v4, v.v5, (a, b) => a > b)}">${v.v5}/2</td></tr>`;
  }
  h += `<tr><td>Protected label</td><td>${(A.off.label * 100).toFixed(0)}%</td><td>${(A.v4.label * 100).toFixed(0)}%</td><td class="${cls(A.v4.label, A.v5.label, (a, b) => a < b - 0.03)}">${(A.v5.label * 100).toFixed(0)}%</td></tr>`;
  h += `<tr><td>Input tokens per call</td><td>${A.off.in_call.toLocaleString()}</td><td>${A.v4.in_call.toLocaleString()}</td><td class="${cls(A.v4.in_call, A.v5.in_call, (a, b) => a < b - 100)}">${A.v5.in_call.toLocaleString()}</td></tr>`;
  t.innerHTML = h;
}
function cats() {
  const svg = document.getElementById("cats"); svg.innerHTML = "";
  const C = D.models[model].cats, keys = Object.keys(CATN).filter(k => C[k]);
  const T = 10, B = 200, cw = 1000 / keys.length;
  const y = v => B - (B - T) * v;
  [0, 0.5, 1].forEach(g => { el("line", { x1: 0, x2: 1000, y1: y(g), y2: y(g), stroke: "var(--grid)" }, svg); txt(svg, 0, y(g) - 4, (g * 100) + "%", { class: "muted" }); });
  keys.forEach((k, i) => {
    const cx = cw * i + cw / 2;
    txt(svg, cx, B + 22, CATN[k], { "text-anchor": "middle", class: "muted" });
    ARMS.forEach(([a, name], j) => {
      const v = C[k][a]; if (v == null) return;
      const bx = cx - 21 + j * 15;
      el("rect", { x: bx, y: y(v), width: 12, height: Math.max(2, B - y(v)), rx: 3, fill: `var(--${a})` }, svg);
    });
    const hit = el("rect", { x: cw * i, y: T, width: cw, height: B - T + 26, fill: "transparent" }, svg);
    hit.addEventListener("mousemove", e => show(e, `<b>${CATN[k]}</b>` + ARMS.map(([a, n]) => `<div class="r"><span>${n}</span><b>${(C[k][a] * 100).toFixed(0)}%</b></div>`).join("")));
    hit.addEventListener("mouseleave", hide);
  });
}
function draw() { kpis(); bars(); checks(); cats(); }
segs("model", [["sonnet", "Sonnet"], ["opus", "Opus"], ["haiku", "Haiku"]], model, k => { model = k; draw(); });
segs("metric", Object.entries(M).map(([k, m]) => [k, m.label]), metric, k => { metric = k; bars(); });
draw();

  `Tests passed in every coding run. Spend: $${D.cost.bench} for the benchmark and $${D.cost.judge} for grading, at API-rate estimates.`;
